map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP: redirect everything to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name verify.devil2devil.asu.edu;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: reverse proxy to the Flask/Gunicorn backend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name verify.devil2devil.asu.edu;

    ssl_certificate /etc/letsencrypt/live/verify.devil2devil.asu.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verify.devil2devil.asu.edu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    access_log /var/log/nginx/verify_access.log;
    error_log  /var/log/nginx/verify_error.log;

    root /var/www/verify;
    index index.html;

    location / {
        proxy_pass http://forklift:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
