# Verification configuration
# Update target_term_code each term to correctly classify incoming/current students.
# Format: 4-digit ASU term code (e.g. 2267 = Fall 2026, 2261 = Spring 2026)
verification:
  target_term_code: "2267"

# Admin panel access configuration
# role_ids: roles that get full admin panel access
# restricted_role_ids: roles that can access the admin panel but NOT message logs or stats
admin:
  role_ids:
    - "1213199035968528434"  # Admin
  restricted_role_ids:
    - "1477021385187655740"  # Officer
