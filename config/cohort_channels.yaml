    topic: '🎯 **Welcome to Looking for Group!**


      Looking to find your people? You’re in the right place! 💛


      Use this forum to connect with other Sun Devils who share your interests, from gym buddies 🏋️‍♀️ and tennis partners 🎾 to anime fans, gamers, and rock ’n’ roll lovers 🎸.


      💬 **Before you post:**


      1️⃣ **Keep it friendly and respectful.**

      This is a positive space for students to meet and hang out — be kind and considerate when posting or replying.


      2️⃣ **English only, please.**

      Devil2Devil is an English-only server so everyone can safely participate and understand each other. 🌎


      3️⃣ **Be safe.**

      If you’re planning an in-person meetup, keep it public and use good judgment. ASU staff and mods aren’t able to monitor off-platform meetups.


      ✨ **Posting tips:**


      When starting a post, share what you’re looking for!

      You can include:

      * The **activity **or **hobby **you want to do

      * Whether it’s **online **or **in person**

      * A bit about yourself or your schedule


      🌟 **Quick reminders:**


      * Respect others’ boundaries and privacy.

      * No spam or promotions.

      * Keep things on-topic and fun — this is about connection and community!'
