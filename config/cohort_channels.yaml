    topic: "**\U0001F31E Welcome to Ask ASU Staff!**\n\nGot a question for ASU staff or current students? You’re in the right place! This is your one-stop spot to get help with all things ASU — just make\
      \ sure to tag your post with the right topic so it reaches the right people. \U0001F4AC\n\n**\U0001F50D Before you post:**\n\n**1️⃣ Check the <#1187152488273559572> channel.**\n A lot of common questions\
      \ are already answered there!\n**2️⃣ Search the forum.**\n Click the \U0001F50D icon or press Ctrl + F / Command + F to see if someone’s already asked the same thing. You might find your answer even\
      \ faster. ⚡\n**\U0001F3F7️ Choose a tag:**\nWhen you make a post, use a tag that fits your question best:\n* **Enrollment** → applications, Next Steps Center, deadlines\n\n* **Housing** → residence\
      \ halls, move-in, assignments\n* **Transfer** → credits, evaluations, transfer process\n* **International** → visas, arrival, orientation, campus life\n* **Financial Aid** → FAFSA, scholarships, billing,\
      \ payments\n* **I Need a Gold Guide** → ask a current student for tips or advice \U0001F393\n\n**\U0001F4AC Quick tips:**\n\n* Be clear about what you’re asking so staff or students can help faster.\n\
      * Be kind and respectful — everyone’s here to help.\n* Don’t post personal info (like ASURITE User IDs or financial details)."
    available_tags:
