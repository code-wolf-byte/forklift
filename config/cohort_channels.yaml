      \ that one instead of starting a new one.\n\n\U0001F4AC **What to include:**\nWhen introducing yourself, you can share things like:\n\n* Your major or program\n* Why you chose it\n* What you’re excited\
      \ to learn or do\n* Anything fun you’d like your peers to know"
