[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forklift"
version = "0.1.0"
description = "A command-line tool for managing and deploying applications to cloud platforms"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click",
    "requests",
]

[project.scripts]
forklift = "src.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/forklift"
Repository = "https://github.com/yourusername/forklift"