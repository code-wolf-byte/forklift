version: "3.9"

services:
  forklift:
    image: ghcr.io/your-org/forklift:latest
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=forklift"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - forklift
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/verify.conf:/etc/nginx/conf.d/verify.conf:ro
      - ./letsencrypt:/etc/letsencrypt
      - ./letsencrypt-webroot:/var/www/letsencrypt
      - ./webroot:/var/www/verify
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=forklift"

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --scope forklift --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
