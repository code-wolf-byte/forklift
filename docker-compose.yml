services:
  forklift:
    image: ghcr.io/your-org/forklift:latest
    build:
      context: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=forklift"

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --scope forklift --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  forklift-refresh-roles:
    image: ghcr.io/your-org/forklift:latest
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
      - ./data:/app/data
    restart: "no"
    entrypoint: ["python", "scripts/refresh_salesforce_roles.py"]
